<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ghi chú</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1c1e21;--muted:#6b7280;--accent:#2563eb;--btn:#2563eb;--border:#d7dbe0;--err:#c62828;--ok:#2e7d32;--sel:#e8effd}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1c1f24;--text:#e6e8eb;--muted:#9aa3ad;--accent:#4c8dff;--btn:#2f6fe0;--border:#333a42;--err:#ff6b6b;--ok:#66bb6a;--sel:#26324a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:16px}
.narrow{max-width:440px;margin:8vh auto 0}
h1{font-size:1.25rem;margin:0 0 12px}
label{display:block;margin:12px 0 0;font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
input,textarea{width:100%;margin-top:4px;padding:10px 12px;font:inherit;font-size:1rem;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0}
textarea{min-height:55vh;resize:vertical;line-height:1.6}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;margin-top:16px;color:#fff;background:var(--btn)}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--border)}
button.danger{color:var(--err)}
button:disabled{opacity:.6;cursor:wait}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar button{margin-top:0}
.spacer{flex:1}
.muted{color:var(--muted);font-size:.9rem}
.msg{min-height:1.4em;margin:10px 0 0;font-size:.9rem}
.msg.err{color:var(--err)}
.msg.ok{color:var(--ok)}
details{margin-top:14px}
summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;margin-top:12px}
.layout>*{min-width:0}
.notelist{display:flex;flex-direction:column;gap:4px}
.notelist button{margin:0;text-align:left;color:var(--text);background:transparent;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.notelist button.active{background:var(--sel);border-color:var(--accent)}
.notelist button{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.notelist button.dragging{position:relative;z-index:5;opacity:.85;background:var(--sel);border-color:var(--accent)}
.notelist button.db{box-shadow:inset 0 3px 0 var(--accent)}
.notelist button.da{box-shadow:inset 0 -3px 0 var(--accent)}
.notelist p{margin:6px 0}
#q{margin:0 0 8px;-webkit-appearance:none;appearance:none}
.hint{margin:6px 0 0;font-size:.8rem}
.block{width:100%}
@media (max-width:640px){
  .wrap{padding:10px}
  .card{padding:14px;margin-top:10px;border-radius:10px}
  .narrow{margin-top:4vh}
  .layout{grid-template-columns:minmax(0,1fr);gap:12px}
  .notelist{flex-direction:row;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:thin}
  .notelist button{width:auto;flex:0 0 auto;max-width:60vw;min-height:44px}
  .notelist button.db{box-shadow:inset 3px 0 0 var(--accent)}
  .notelist button.da{box-shadow:inset -3px 0 0 var(--accent)}
  button{min-height:44px}
  .bar button{flex:0 0 auto}
  .bar .spacer{flex:1 1 0;min-width:0}
  textarea{min-height:45vh;min-height:45dvh}
  #pinBtn,#delBtn,#delBox button,#pinBox button,#addBox button{width:calc(50% - 8px)}
  #pinBtn{margin-right:8px!important}
}
.pw{position:relative;display:block;margin-top:4px}
.pw input{margin-top:0;padding-right:44px}
.pw .eye{position:absolute;top:0;right:0;bottom:0;width:42px;margin:0;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--muted);border-radius:0 8px 8px 0}
.pw .eye:hover,.pw .eye[aria-pressed="true"]{color:var(--accent)}
.pw .eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pw .eye .off{display:none}
.pw .eye[aria-pressed="true"] .on{display:none}
.pw .eye[aria-pressed="true"] .off{display:block}
</style>
</head>
<body>
<div class="wrap">

  <section id="v-loading" class="card narrow">
    <p id="loadMsg" class="msg">Đang tải…</p>
  </section>

  <section id="v-setup" class="card narrow" hidden>
    <h1>Thiết lập lần đầu</h1>
    <p class="muted">Repo chưa có dữ liệu. Token và nội dung sẽ được mã hóa bằng mật khẩu trước khi lưu lên GitHub.</p>
    <p class="muted" id="s-repo"></p>
    <form id="setupForm">
      <label>GitHub token (quyền Contents: Read and write)
        <input id="s-token" type="password" autocomplete="off" required>
      </label>
      <label>Mật khẩu mới (ít nhất 12 ký tự)
        <input id="s-pw" type="password" autocomplete="new-password" required>
      </label>
      <label>Nhập lại mật khẩu
        <input id="s-pw2" type="password" autocomplete="new-password" required>
      </label>
      <button id="s-btn" type="submit">Tạo và lưu</button>
      <p id="s-msg" class="msg"></p>
    </form>
  </section>

  <section id="v-unlock" class="card narrow" hidden>
    <h1>Ghi chú</h1>
    <form id="unlockForm">
      <label>Mật khẩu
        <input id="u-pw" type="password" autocomplete="off" required>
      </label>
      <button id="u-btn" type="submit">Mở</button>
      <p id="u-msg" class="msg"></p>
    </form>
  </section>

  <section id="v-editor" class="card" hidden>
    <div class="bar">
      <span id="status" class="muted"></span>
      <span class="spacer"></span>
      <button id="saveBtn" type="button">Lưu</button>
      <button id="lockBtn" type="button" class="ghost">Khóa</button>
    </div>

    <div class="layout">
      <aside>
        <input id="q" type="search" placeholder="Tìm ghi chú…" autocomplete="off" enterkeyhint="search" aria-label="Tìm ghi chú">
        <p id="qInfo" class="muted hint" style="margin:0 0 6px" hidden></p>
        <div id="noteList" class="notelist"></div>
        <button id="addBtn" type="button" class="ghost block">+ Thêm mục</button>
        <div id="addBox" hidden>
          <label>Nhập mật khẩu để thêm mục
            <input id="a-pw" type="password" autocomplete="off">
          </label>
          <button id="addOk" type="button" class="ghost">Xác nhận</button>
          <button id="addCancel" type="button" class="ghost">Hủy</button>
        </div>
        <p id="dragHint" class="muted hint">Giữ một mục rồi kéo để đổi vị trí.</p>
      </aside>
      <div>
        <label style="margin-top:0">Tên mục
          <input id="title" autocomplete="off" maxlength="80">
        </label>
        <label>Nội dung
          <textarea id="text" spellcheck="false"></textarea>
        </label>
        <button id="pinBtn" type="button" class="ghost" style="margin-right:8px">Ghim mục này</button>
        <button id="delBtn" type="button" class="ghost danger">Xóa mục này</button>
        <div id="delBox" hidden>
          <label>Nhập mật khẩu để xóa mục "<span id="d-name"></span>"
            <input id="d-pw" type="password" autocomplete="off">
          </label>
          <button id="delOk" type="button" class="ghost danger">Xác nhận xóa</button>
          <button id="delCancel" type="button" class="ghost">Hủy</button>
        </div>
        <div id="pinBox" hidden>
          <label>Nhập mật khẩu để <span id="p-action"></span> mục "<span id="p-name"></span>"
            <input id="p-pw" type="password" autocomplete="off">
          </label>
          <button id="pinOk" type="button" class="ghost">Xác nhận</button>
          <button id="pinCancel" type="button" class="ghost">Hủy</button>
        </div>
      </div>
    </div>

    <p id="e-msg" class="msg"></p>
    <details>
      <summary>Đổi mật khẩu / token</summary>
      <label>Mật khẩu hiện tại (bắt buộc)
        <input id="o-pw1" type="password" autocomplete="off">
      </label>
      <label>Nhập lại mật khẩu hiện tại
        <input id="o-pw2" type="password" autocomplete="off">
      </label>
      <label>Mật khẩu mới (để trống nếu không đổi)
        <input id="n-pw" type="password" autocomplete="new-password">
      </label>
      <label>Nhập lại mật khẩu mới
        <input id="n-pw2" type="password" autocomplete="new-password">
      </label>
      <label>Token mới (để trống nếu không đổi)
        <input id="n-token" type="password" autocomplete="off">
      </label>
      <button id="applyBtn" type="button" class="ghost">Áp dụng và lưu</button>
    </details>
  </section>

</div>

<script>
(() => {
'use strict';

const API = 'https://api.github.com';
const PATH = 'data.json';
const ITER = 600000;
const IDLE_MS = 10 * 60 * 1000;
const enc = new TextEncoder();
const dec = new TextDecoder();
const $ = id => document.getElementById(id);

const S = { owner: '', repo: '', sha: null, file: null, key: null, salt: null,
            iter: ITER, token: null, notes: [], cur: null, dirty: false, saved: '', query: '' };

/* ---------- tiện ích ---------- */
function show(name) {
  ['loading', 'setup', 'unlock', 'editor'].forEach(v => { $('v-' + v).hidden = (v !== name); });
}
function setMsg(id, text, kind) {
  const el = $(id);
  el.textContent = text || '';
  el.className = 'msg' + (kind ? ' ' + kind : '');
}
function toB64(buf) {
  const u = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
function fromB64(s) {
  const bin = atob(s);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function busy(btn, on) { btn.disabled = on; }
function newId() {
  const b = crypto.getRandomValues(new Uint8Array(8));
  return Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
}

/* ---------- mã hóa (AES-GCM + PBKDF2) ---------- */
async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function makeFile(key, salt, iter, payload) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(payload)));
  return { v: 1, iter, salt: toB64(salt), iv: toB64(iv), ct: toB64(ct) };
}

/* ---------- GitHub API ---------- */
function fileUrl() { return `${API}/repos/${S.owner}/${S.repo}/contents/${PATH}`; }

async function fetchFile() {
  const r = await fetch(fileUrl(), { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
  if (r.status === 404) return null;
  if (r.status === 403 || r.status === 429) throw new Error('GitHub tạm chặn truy cập (quá nhiều yêu cầu). Thử lại sau ít phút.');
  if (!r.ok) throw new Error('GitHub trả về lỗi ' + r.status + '.');
  const j = await r.json();
  if (!j.content) throw new Error('Không đọc được file dữ liệu (có thể quá lớn).');
  return { sha: j.sha, file: JSON.parse(atob(j.content.replace(/\s/g, ''))) };
}

async function putFile(token, fileObj, sha) {
  const body = { message: 'update', content: btoa(JSON.stringify(fileObj)) };
  if (sha) body.sha = sha;
  const r = await fetch(fileUrl(), {
    method: 'PUT',
    headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (r.ok) return (await r.json()).content.sha;
  if (r.status === 401) throw new Error('Token sai hoặc đã hết hạn.');
  if (r.status === 403 || r.status === 404) throw new Error('Token không ghi được vào repo này. Kiểm tra token có quyền Contents: Read and write và đúng repo.');
  if (r.status === 409 || r.status === 422) {
    throw new Error('File trên GitHub đã thay đổi ở nơi khác. Hãy sao chép nội dung bạn vừa sửa, bấm Khóa rồi mở lại.');
  }
  throw new Error('Lỗi khi lưu: ' + r.status);
}

/* ---------- xác định repo ---------- */
function detectRepo() {
  const h = location.hostname;
  if (h.endsWith('.github.io')) {
    const owner = h.slice(0, -'.github.io'.length);
    let seg = location.pathname.split('/').filter(Boolean)[0] || '';
    if (!seg || /\.html?$/.test(seg)) seg = owner + '.github.io';
    return { owner, repo: seg };
  }
  return { owner: 'tvinhgit', repo: 'ghi-chu' };
}

/* ---------- dữ liệu nhiều mục ---------- */
function normalize(data) {
  let notes = [];
  if (data && Array.isArray(data.notes)) {
    notes = data.notes.map(n => ({
      id: String(n.id || newId()),
      title: String(n.title || ''),
      text: String(n.text || ''),
      pinned: !!n.pinned
    }));
  } else if (data && typeof data.text === 'string') {
    // định dạng cũ (một khối văn bản duy nhất)
    notes = [{ id: newId(), title: 'Ghi chú 1', text: data.text, pinned: false }];
  }
  if (!notes.length) notes = [{ id: newId(), title: 'Ghi chú 1', text: '', pinned: false }];
  return notes;
}
function curNote() { return S.notes.find(n => n.id === S.cur) || S.notes[0]; }
function refreshDirty() {
  S.dirty = (JSON.stringify(S.notes) !== S.saved);
  $('status').textContent = S.dirty ? 'Chưa lưu thay đổi' : 'Đã lưu';
}
function sortedNotes() {
  return S.notes.filter(n => n.pinned).concat(S.notes.filter(n => !n.pinned));
}
/* ---------- tìm kiếm ---------- */
function fold(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
}
function queryTokens() { return fold(S.query).split(/\s+/).filter(Boolean); }
function visibleNotes() {
  const all = sortedNotes();
  const tk = queryTokens();
  if (!tk.length) return all;
  return all.filter(n => {
    const h = fold(n.title + '\n' + n.text);
    return tk.every(t => h.includes(t));
  });
}
function clearSearch() {
  S.query = '';
  $('q').value = '';
}
function jumpToMatch() {
  const tk = queryTokens();
  const ta = $('text');
  const full = ta.value;
  const f = fold(full);
  if (!tk.length || f.length !== full.length) return;
  let at = -1, len = 0;
  tk.forEach(t => {
    const i = f.indexOf(t);
    if (i >= 0 && (at < 0 || i < at)) { at = i; len = t.length; }
  });
  if (at < 0) return;
  ta.value = full.slice(0, at);
  const h = ta.scrollHeight;
  ta.value = full;
  if (window.matchMedia('(pointer:fine)').matches) {
    ta.focus({ preventScroll: true });
    ta.setSelectionRange(at, at + len);
  }
  ta.scrollTop = Math.max(0, h - ta.clientHeight / 2);
}

/* ---------- giữ để kéo đổi vị trí ---------- */
let dragJustEnded = false;
const HOLD_MS = 380;
function isRowLayout() { return getComputedStyle($('noteList')).flexDirection === 'row'; }

function moveNote(note, others, dropIdx) {
  const ids = others.map(el => el.dataset.id);
  ids.splice(dropIdx, 0, note.id);
  const group = ids.map(id => S.notes.find(x => x.id === id)).filter(Boolean);
  const rest = S.notes.filter(x => x.pinned !== note.pinned);
  const before = S.notes.map(x => x.id).join();
  S.notes = note.pinned ? group.concat(rest) : rest.concat(group);
  if (S.notes.map(x => x.id).join() === before) return;
  renderList();
  refreshDirty();
  save();
}

function attachDrag(btn, note) {
  const box = $('noteList');
  let timer = null, active = false, pid = null, row = false;
  let sx = 0, sy = 0, lastX = 0, lastY = 0, scroll0 = 0, scrollTimer = null;
  let others = [], dropIdx = 0;

  function cancelHold() { clearTimeout(timer); timer = null; }

  function update() {
    const p = row ? lastX : lastY;
    const d = row ? (lastX - sx) + (box.scrollLeft - scroll0) : (lastY - sy);
    btn.style.transform = row ? 'translateX(' + d + 'px)' : 'translateY(' + d + 'px)';
    let k = 0;
    others.forEach(el => {
      const r = el.getBoundingClientRect();
      const m = row ? r.left + r.width / 2 : r.top + r.height / 2;
      if (m < p) k++;
    });
    dropIdx = k;
    others.forEach(el => el.classList.remove('db', 'da'));
    if (others.length) {
      if (k < others.length) others[k].classList.add('db');
      else others[others.length - 1].classList.add('da');
    }
  }

  function autoScroll() {
    if (!active || !row) return;
    const r = box.getBoundingClientRect();
    const b0 = box.scrollLeft;
    if (lastX < r.left + 36) box.scrollLeft -= 10;
    else if (lastX > r.right - 36) box.scrollLeft += 10;
    if (box.scrollLeft !== b0) update();
  }

  function start() {
    timer = null;
    active = true;
    row = isRowLayout();
    scroll0 = row ? box.scrollLeft : 0;
    others = Array.from(box.children).filter(el =>
      el !== btn && el.tagName === 'BUTTON' && el.dataset.pinned === btn.dataset.pinned);
    btn.classList.add('dragging');
    try { btn.setPointerCapture(pid); } catch (e) { /* bỏ qua */ }
    if (navigator.vibrate) navigator.vibrate(15);
    scrollTimer = setInterval(autoScroll, 16);
    update();
  }

  function finish(commit) {
    cancelHold();
    if (!active) return;
    active = false;
    clearInterval(scrollTimer);
    try { btn.releasePointerCapture(pid); } catch (e) { /* bỏ qua */ }
    btn.classList.remove('dragging');
    btn.style.transform = '';
    others.forEach(el => el.classList.remove('db', 'da'));
    dragJustEnded = true;
    setTimeout(() => { dragJustEnded = false; }, 80);
    if (commit) moveNote(note, others, dropIdx);
  }

  btn.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (active) return;
    pid = e.pointerId;
    sx = lastX = e.clientX;
    sy = lastY = e.clientY;
    cancelHold();
    timer = setTimeout(start, HOLD_MS);
  });
  btn.addEventListener('pointermove', e => {
    if (e.pointerId !== pid) return;
    if (!active) {
      if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) cancelHold();
      return;
    }
    lastX = e.clientX;
    lastY = e.clientY;
    update();
  });
  btn.addEventListener('pointerup', e => {
    if (e.pointerId !== pid) return;
    if (active) finish(true); else cancelHold();
  });
  btn.addEventListener('pointercancel', e => {
    if (e.pointerId !== pid) return;
    if (active) finish(false); else cancelHold();
  });
  btn.addEventListener('pointerleave', () => { if (!active) cancelHold(); });
  btn.addEventListener('touchmove', e => { if (active) e.preventDefault(); }, { passive: false });
  btn.addEventListener('contextmenu', e => { if (timer || active) e.preventDefault(); });
}

function renderList() {
  const box = $('noteList');
  box.textContent = '';
  const list = visibleNotes();
  const searching = queryTokens().length > 0;
  list.forEach(n => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = (n.pinned ? '📌 ' : '') + (n.title.trim() || '(không tên)');
    b.title = b.textContent;
    b.dataset.id = n.id;
    b.dataset.pinned = n.pinned ? '1' : '0';
    if (n.id === S.cur) b.className = 'active';
    b.addEventListener('click', () => {
      if (dragJustEnded) return;
      switchTo(n.id);
      if (S.query) jumpToMatch();
    });
    if (!searching) attachDrag(b, n);
    box.appendChild(b);
  });
  if (searching && !list.length) {
    const p = document.createElement('p');
    p.className = 'muted';
    p.textContent = 'Không có mục nào khớp.';
    box.appendChild(p);
  }
  $('qInfo').hidden = !searching;
  $('qInfo').textContent = searching ? list.length + '/' + S.notes.length + ' mục khớp' : '';
  $('dragHint').hidden = searching;
  $('pinBtn').textContent = curNote().pinned ? 'Bỏ ghim' : 'Ghim mục này';
}
function hideDelBox() {
  $('delBox').hidden = true;
  $('d-pw').value = '';
  $('delBtn').hidden = false;
}
function switchTo(id) {
  S.cur = id;
  const n = curNote();
  $('title').value = n.title;
  $('text').value = n.text;
  hideDelBox();
  hidePinBox();
  renderList();
}
function addNote() {
  const n = { id: newId(), title: 'Ghi chú ' + (S.notes.length + 1), text: '', pinned: false };
  S.notes.push(n);
  clearSearch();
  switchTo(n.id);
  refreshDirty();
  $('title').focus();
  $('title').select();
  save();
}
function togglePin() {
  const n = curNote();
  n.pinned = !n.pinned;
  renderList();
  refreshDirty();
  save();
}
function hidePinBox() {
  $('pinBox').hidden = true;
  $('p-pw').value = '';
  $('pinBtn').hidden = false;
}
function askPin() {
  hideDelBox();
  const n = curNote();
  $('p-action').textContent = n.pinned ? 'bỏ ghim' : 'ghim';
  $('p-name').textContent = n.title.trim() || '(không tên)';
  $('pinBtn').hidden = true;
  $('pinBox').hidden = false;
  $('p-pw').focus();
}
async function confirmPin() {
  if ($('pinOk').disabled) return;
  const pw = $('p-pw').value;
  if (!pw) return setMsg('e-msg', 'Hãy nhập mật khẩu để ghim hoặc bỏ ghim.', 'err');
  busy($('pinOk'), true);
  setMsg('e-msg', 'Đang kiểm tra mật khẩu…');
  try {
    if (!(await verifyPassword(pw))) {
      setMsg('e-msg', 'Sai mật khẩu, chưa thay đổi gì.', 'err');
      $('p-pw').select();
      return;
    }
    hidePinBox();
    setMsg('e-msg', '');
    togglePin();
  } finally {
    busy($('pinOk'), false);
  }
}
function hideAddBox() {
  $('addBox').hidden = true;
  $('a-pw').value = '';
  $('addBtn').hidden = false;
}
function askAdd() {
  $('addBtn').hidden = true;
  $('addBox').hidden = false;
  $('a-pw').focus();
}
async function confirmAdd() {
  if ($('addOk').disabled) return;
  const pw = $('a-pw').value;
  if (!pw) return setMsg('e-msg', 'Hãy nhập mật khẩu để thêm mục.', 'err');
  busy($('addOk'), true);
  setMsg('e-msg', 'Đang kiểm tra mật khẩu…');
  try {
    if (!(await verifyPassword(pw))) {
      setMsg('e-msg', 'Sai mật khẩu, chưa thêm mục nào.', 'err');
      $('a-pw').select();
      return;
    }
    hideAddBox();
    setMsg('e-msg', '');
    addNote();
  } finally {
    busy($('addOk'), false);
  }
}
async function verifyPassword(pw) {
  try {
    const f = S.file;
    const key = await deriveKey(pw, fromB64(f.salt), f.iter || ITER);
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(f.iv) }, key, fromB64(f.ct));
    return true;
  } catch (e) {
    return false;
  }
}
function askDelete() {
  hidePinBox();
  $('d-name').textContent = curNote().title.trim() || '(không tên)';
  $('delBtn').hidden = true;
  $('delBox').hidden = false;
  $('d-pw').focus();
}
async function confirmDelete() {
  if ($('delOk').disabled) return;
  const pw = $('d-pw').value;
  if (!pw) return setMsg('e-msg', 'Hãy nhập mật khẩu để xóa.', 'err');
  const n = curNote();
  busy($('delOk'), true);
  setMsg('e-msg', 'Đang kiểm tra mật khẩu…');
  try {
    if (!(await verifyPassword(pw))) {
      setMsg('e-msg', 'Sai mật khẩu, chưa xóa mục nào.', 'err');
      $('d-pw').select();
      return;
    }
    if (S.notes.indexOf(n) < 0) return;
    const pos = sortedNotes().indexOf(n);
    S.notes.splice(S.notes.indexOf(n), 1);
    if (!S.notes.length) S.notes.push({ id: newId(), title: 'Ghi chú 1', text: '', pinned: false });
    const after = sortedNotes();
    switchTo(after[Math.min(pos, after.length - 1)].id);
    refreshDirty();
    setMsg('e-msg', 'Đã xóa mục. Bấm Lưu để cập nhật lên GitHub.', 'ok');
  } finally {
    busy($('delOk'), false);
  }
}

/* ---------- luồng chính ---------- */
async function init() {
  show('loading');
  setMsg('loadMsg', 'Đang tải…');
  try {
    const r = await fetchFile();
    if (!r) {
      $('s-repo').textContent = `Repo: ${S.owner}/${S.repo}`;
      show('setup');
      $('s-token').focus();
      return;
    }
    S.sha = r.sha;
    S.file = r.file;
    show('unlock');
    $('u-pw').focus();
  } catch (e) {
    setMsg('loadMsg', e.message, 'err');
  }
}

async function doSetup(ev) {
  ev.preventDefault();
  const token = $('s-token').value.trim();
  const pw = $('s-pw').value;
  if (!token) return setMsg('s-msg', 'Chưa nhập token.', 'err');
  if (pw.length < 12) return setMsg('s-msg', 'Mật khẩu cần ít nhất 12 ký tự.', 'err');
  if (pw !== $('s-pw2').value) return setMsg('s-msg', 'Hai mật khẩu không khớp.', 'err');
  busy($('s-btn'), true);
  setMsg('s-msg', 'Đang mã hóa và lưu…');
  try {
    const notes = normalize(null);
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await deriveKey(pw, salt, ITER);
    const file = await makeFile(key, salt, ITER, { notes, token });
    const sha = await putFile(token, file, null);
    S.key = key; S.salt = salt; S.iter = ITER; S.token = token; S.sha = sha; S.file = file;
    $('s-token').value = ''; $('s-pw').value = ''; $('s-pw2').value = '';
    openEditor(notes);
  } catch (e) {
    setMsg('s-msg', e.message, 'err');
  } finally {
    busy($('s-btn'), false);
  }
}

async function doUnlock(ev) {
  ev.preventDefault();
  const pw = $('u-pw').value;
  busy($('u-btn'), true);
  setMsg('u-msg', 'Đang giải mã…');
  try {
    const f = S.file;
    const salt = fromB64(f.salt);
    const iter = f.iter || ITER;
    const key = await deriveKey(pw, salt, iter);
    let plain;
    try {
      plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(f.iv) }, key, fromB64(f.ct));
    } catch (e) {
      throw new Error('Sai mật khẩu.');
    }
    const data = JSON.parse(dec.decode(plain));
    S.key = key; S.salt = salt; S.iter = iter; S.token = data.token;
    $('u-pw').value = '';
    openEditor(normalize(data));
  } catch (e) {
    setMsg('u-msg', e.message, 'err');
    $('u-pw').select();
  } finally {
    busy($('u-btn'), false);
  }
}

function openEditor(notes) {
  S.notes = notes;
  S.cur = notes[0].id;
  S.saved = JSON.stringify(S.notes);
  setMsg('u-msg', '');
  setMsg('s-msg', '');
  setMsg('e-msg', '');
  switchTo(S.cur);
  refreshDirty();
  show('editor');
  resetIdle();
  $('text').focus();
}

async function persist(next, okText) {
  const sess = session;
  const snap = JSON.stringify(S.notes);
  const file = await makeFile(next.key, next.salt, next.iter, { notes: JSON.parse(snap), token: next.token });
  const sha = await putFile(next.token, file, S.sha);
  S.sha = sha;
  S.file = file;
  if (sess !== session) return;   // đã Khóa trong lúc lưu: không khôi phục key/token
  S.key = next.key; S.salt = next.salt; S.iter = next.iter; S.token = next.token;
  S.saved = snap;
  refreshDirty();
  setMsg('e-msg', okText || 'Đã lưu lên GitHub.', 'ok');
}

let saving = false, saveAgain = false, session = 0;
async function save() {
  if (!S.key) return;
  if (saving) { saveAgain = true; return; }
  saving = true;
  busy($('saveBtn'), true);
  setMsg('e-msg', 'Đang lưu…');
  try {
    await persist({ key: S.key, salt: S.salt, iter: S.iter, token: S.token });
  } catch (e) {
    setMsg('e-msg', e.message, 'err');
  } finally {
    saving = false;
    busy($('saveBtn'), false);
    if (saveAgain) { saveAgain = false; save(); }
  }
}

async function applySettings() {
  const np = $('n-pw').value;
  const nt = $('n-token').value.trim();
  const o1 = $('o-pw1').value;
  const o2 = $('o-pw2').value;
  if (!np && !nt) return setMsg('e-msg', 'Chưa nhập gì để đổi.', 'err');
  if (!o1 || !o2) return setMsg('e-msg', 'Hãy nhập mật khẩu hiện tại 2 lần để xác nhận.', 'err');
  if (o1 !== o2) return setMsg('e-msg', 'Hai lần nhập mật khẩu hiện tại không khớp.', 'err');
  if (np && np.length < 12) return setMsg('e-msg', 'Mật khẩu mới cần ít nhất 12 ký tự.', 'err');
  if (np && np !== $('n-pw2').value) return setMsg('e-msg', 'Hai lần nhập mật khẩu mới không khớp.', 'err');
  if (saving) return setMsg('e-msg', 'Đang lưu, hãy thử lại sau vài giây.', 'err');
  saving = true;
  busy($('applyBtn'), true);
  setMsg('e-msg', 'Đang xử lý…');
  try {
    if (!(await verifyPassword(o1))) throw new Error('Mật khẩu hiện tại không đúng.');
    const next ={ key: S.key, salt: S.salt, iter: S.iter, token: nt || S.token };
    if (np) {
      next.salt = crypto.getRandomValues(new Uint8Array(16));
      next.iter = ITER;
      next.key = await deriveKey(np, next.salt, next.iter);
    }
    await persist(next, 'Đã cập nhật và lưu.');
    $('o-pw1').value = '';
    $('o-pw2').value = '';
    $('n-pw').value = '';
    $('n-pw2').value = '';
    $('n-token').value = '';
  } catch (e) {
    setMsg('e-msg', e.message, 'err');
  } finally {
    saving = false;
    busy($('applyBtn'), false);
  }
}

function lock() {
  session++; saveAgain = false;
  S.key = null; S.token = null; S.salt = null; S.file = null; S.sha = null;
  S.notes = []; S.cur = null; S.dirty = false; S.saved = '';
  $('text').value = '';
  $('title').value = '';
  $('noteList').textContent = '';
  clearSearch();
  hideDelBox();
  hidePinBox();
  hideAddBox();
  $('o-pw1').value = '';
  $('o-pw2').value = '';
  $('n-pw2').value = '';
  $('n-pw').value = '';
  $('n-token').value = '';
  resetEyes();
  init();
}

/* ---------- tự khóa khi không hoạt động ---------- */
let idleTimer = null;
function resetIdle() {
  clearTimeout(idleTimer);
  if (S.key) {
    idleTimer = setTimeout(() => { if (S.key && !S.dirty) lock(); else resetIdle(); }, IDLE_MS);
  }
}
['keydown', 'pointerdown', 'input'].forEach(t => document.addEventListener(t, resetIdle, { passive: true }));

/* ---------- sự kiện ---------- */
$('setupForm').addEventListener('submit', doSetup);
$('unlockForm').addEventListener('submit', doUnlock);
$('saveBtn').addEventListener('click', save);
$('lockBtn').addEventListener('click', () => {
  if (S.dirty && !confirm('Còn thay đổi chưa lưu. Vẫn khóa?')) return;
  lock();
});
$('applyBtn').addEventListener('click', applySettings);
$('addBtn').addEventListener('click', askAdd);
$('addOk').addEventListener('click', confirmAdd);
$('addCancel').addEventListener('click', hideAddBox);
$('a-pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); confirmAdd(); }
  else if (e.key === 'Escape') hideAddBox();
});
$('q').addEventListener('input', () => {
  S.query = $('q').value;
  renderList();
});
$('pinBtn').addEventListener('click', askPin);
$('pinOk').addEventListener('click', confirmPin);
$('pinCancel').addEventListener('click', hidePinBox);
$('p-pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); confirmPin(); }
  else if (e.key === 'Escape') hidePinBox();
});
$('delBtn').addEventListener('click', askDelete);
$('delOk').addEventListener('click', confirmDelete);
$('delCancel').addEventListener('click', hideDelBox);
$('d-pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); confirmDelete(); }
  else if (e.key === 'Escape') hideDelBox();
});
$('text').addEventListener('input', () => {
  curNote().text = $('text').value;
  refreshDirty();
});
$('title').addEventListener('input', () => {
  curNote().title = $('title').value;
  renderList();
  refreshDirty();
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && !$('v-editor').hidden) {
    e.preventDefault();
    save();
  }
});
window.addEventListener('beforeunload', e => {
  if (S.dirty) { e.preventDefault(); e.returnValue = ''; }
});

/* ---------- khởi động ---------- */
Object.assign(S, detectRepo());
/* ---------- nút con mắt hiện/ẩn mật khẩu ---------- */
const EYE_SVG = '<svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>'
  + '<svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a19.8 19.8 0 0 1 5.06-5.94M9.9 5.24A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a19.7 19.7 0 0 1-3.17 4.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
function setupEyes() {
  document.querySelectorAll('input[type="password"]').forEach(inp => {
    const wrap = document.createElement('span');
    wrap.className = 'pw';
    inp.parentNode.insertBefore(wrap, inp);
    wrap.appendChild(inp);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'eye';
    b.tabIndex = 0;
    b.setAttribute('aria-label', 'Hiện mật khẩu');
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = EYE_SVG;
    b.addEventListener('click', e => {
      e.preventDefault();
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      b.setAttribute('aria-pressed', show ? 'true' : 'false');
      b.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
      inp.focus();
    });
    wrap.appendChild(b);
  });
}
function resetEyes() {
  document.querySelectorAll('.pw').forEach(w => {
    const inp = w.querySelector('input'), b = w.querySelector('.eye');
    inp.type = 'password';
    b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', 'Hiện mật khẩu');
  });
}
setupEyes();

init();
})();
</script>
